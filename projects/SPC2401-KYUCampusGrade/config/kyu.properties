# KYUCampusGrade configuration.
# Every key can be overridden with -Dkyu.<key>=value or the environment
# variable KYU_<KEY> (dots become underscores), e.g. KYU_REGISTRY_HOST=10.0.0.5

# Where the RMI registry runs (clients and server)
registry.host=localhost
registry.port=1099
# true = the server starts its own registry instead of using rmiregistry
registry.create=false

# Server
# Address written into stubs; set it to the server's LAN IP when clients are on other machines
#server.hostname=10.0.0.5
# Port the GradeService object is exported on (0 = any free port)
server.port=0
server.workers=8
notifier.threads=20
lease.default.ms=600000
lease.max.ms=3600000
dedup.window.ms=86400000
server.journal=data/marks.journal

# Clients
client.timeout.ms=5000
client.retries=3
client.backoff.ms=250
socket.timeout.ms=15000
# Address the server uses to call a student back (set when on another machine)
#client.callback.hostname=10.0.0.21

# Logs
log.dir=logs

# Experiment knobs (leave at 0 in normal use)
net.delay.ms=0
sim.cpu.ms=0
sim.disk.ms=0
sim.cores=0
sim.postapply.ms=0
